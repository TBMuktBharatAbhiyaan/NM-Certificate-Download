<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikshay Mitra Certificate Download</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 900px;
            padding: 40px;
        }
        h1 {
            color: #b71c1c;
            text-align: center;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #667eea;
        }
        input.valid {
            border-color: #28a745;
            background-color: rgba(40,167,69,0.05);
        }
        input.invalid {
            border-color: #dc3545;
            background-color: rgba(220,53,69,0.05);
        }
        #validationMessage {
            margin: 15px 0;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }
        #validationMessage.error {
            background: rgba(220,53,69,0.1);
            color: #dc3545;
        }
        #validationMessage.success {
            background: rgba(40,167,69,0.1);
            color: #28a745;
        }
        .button-group {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        #previewBtn {
            background: #667eea;
            color: white;
        }
        #previewBtn:hover {
            background: #5568d3;
        }
        #downloadBtn {
            background: #28a745;
            color: white;
        }
        #downloadBtn:hover:not(:disabled) {
            background: #218838;
        }
        #downloadBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .preview-box {
            border: 2px dashed #ddd;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-top: 30px;
        }
        #certificateCanvas {
            max-width: 100%;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: none;
            background: white;
        }
        .hint {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Nikshay Mitra Certificate Download</h1>
        
        <div class="input-group">
            <label for="nameInput">Full Name</label>
            <input type="text" id="nameInput" placeholder="Enter name" maxlength="50">
            <div class="hint">Enter participant's full name</div>
        </div>

        <div class="input-group">
            <label for="idInput">Nikshay Mitra ID</label>
            <input type="text" id="idInput" placeholder="Enter NM ID (e.g., M12345678901)" maxlength="12">
            <div class="hint">Format: M followed by 11 digits (M12345678901)</div>
        </div>

        <div id="validationMessage"></div>

        <div class="button-group">
            <button id="previewBtn">👁️ Preview</button>
            <button id="downloadBtn" disabled>⬇️ Download</button>
        </div>

        <div class="preview-box">
            <h3>Certificate Preview</h3>
            <canvas id="certificateCanvas" width="800" height="500"></canvas>
            <p class="hint" id="previewHint">Enter valid details and click Preview to see your certificate</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikshay Mitra Certificate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: linear-gradient(135deg, #87ceeb 0%, #e0f7fa 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Login Page */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #87ceeb 0%, #e0f7fa 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .login-container {
            text-align: center;
            position: relative;
            z-index: 10000;
            margin-bottom: 100px;
        }

        /* Header Text Only */
        .header-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .portal-name {
            font-size: 36px;
            font-weight: 700;
            color: #ff8c00;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .portal-subtitle {
            font-size: 18px;
            color: #555;
            font-weight: 500;
        }

        /* Login Box */
        .login-box {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f9f9f9;
            color: #444;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4169e1;
            background: white;
            box-shadow: 0 0 0 4px rgba(65, 105, 225, 0.1);
        }

        .form-group input::placeholder {
            color: #888;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #4169e1 0%, #1e90ff 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #1e90ff, #0066cc);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(65, 105, 225, 0.25);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 15px;
            display: none;
            text-align: center;
            font-weight: 500;
        }

        /* Footer Stripes - MUCH BROADER */
        .footer-stripes {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 240px;
            z-index: 9998;
            display: flex;
            flex-direction: column;
        }

        .stripe {
            flex: 1;
            transition: all 0.3s ease;
        }

        .stripe:hover {
            filter: brightness(1.1);
        }

        .stripe-saffron {
            background: linear-gradient(135deg, #ff9933 0%, #ff8c00 100%);
        }

        .stripe-white {
            background: white;
            position: relative;
        }

        .stripe-white::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4169e1 0%, #1e90ff 100%);
            opacity: 0.8;
        }

        .stripe-green {
            background: linear-gradient(135deg, #138808 0%, #0d6e05 100%);
        }

        /* Certificate Page */
        .container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #4169e1;
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .input-group input.valid {
            border-color: green;
            background: #f0fff0;
        }

        .input-group input.invalid {
            border-color: red;
            background: #fff0f0;
        }

        #validationMessage {
            margin: 15px 0;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #previewBtn {
            background: #667eea;
            color: white;
        }

        #downloadBtn {
            background: #28a745;
            color: white;
        }

        #downloadBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .preview {
            border: 2px dashed #ddd;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
        }

        canvas {
            max-width: 100%;
            border: 1px solid #ccc;
        }

        #mainContent {
            background: linear-gradient(135deg, #87ceeb 0%, #e0f7fa 100%);
            min-height: 100vh;
            padding: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Login Section -->
    <div id="loginOverlay">
        <div class="login-container">
            <div class="header-text">
                <div class="portal-name">Ni-kshay</div>
                <div class="portal-subtitle">Continue to Ni-kshay</div>
            </div>

            <div class="login-box">
                <div class="form-group">
                    <label>User Name</label>
                    <input type="text" id="officialEmail" placeholder="Enter your User Name">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="officialPassword" placeholder="Enter your Password">
                </div>

                <button class="login-btn" onclick="checkAccess()">Login</button>

                <div class="error-message" id="loginError">❌ Invalid credentials. Please try again.</div>
            </div>
        </div>

        <!-- Footer Stripes - MUCH BROADER NOW -->
        <div class="footer-stripes">
            <div class="stripe stripe-saffron"></div>
            <div class="stripe stripe-white"></div>
            <div class="stripe stripe-green"></div>
        </div>
    </div>

    <!-- Certificate Page -->
    <div id="mainContent">
        <div class="container">
            <h1>Nikshay Mitra Certificate</h1>

            <div class="input-group">
                <label for="nameInput">Full Name</label>
                <input type="text" id="nameInput" placeholder="Enter name" maxlength="50">
            </div>

            <div class="input-group">
                <label for="idInput">Nikshay Mitra ID</label>
                <input type="text" id="idInput" placeholder="Enter Valid & Active NM ID" maxlength="20">
            </div>

            <div id="validationMessage"></div>

            <div class="buttons">
                <button id="previewBtn">Preview</button>
                <button id="downloadBtn" disabled>Download PDF</button>
            </div>

            <div class="preview">
                <canvas id="certificateCanvas" width="800" height="500"></canvas>
                <div id="previewPlaceholder">
                    Enter name and NM ID to preview certificate
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        function checkAccess() {
            const userId = document.getElementById('officialEmail').value.trim().toLowerCase();
            const password = document.getElementById('officialPassword').value;
            const errorMsg = document.getElementById('loginError');
            const loginOverlay = document.getElementById('loginOverlay');
            const mainContent = document.getElementById('mainContent');

            // User ID must be 6-9 characters:
            // starts with dto-, sto-, tbu-, or phi-
            // followed by 2-6 letters (total 6-9 chars)
            const userIdValid = /^(dto|sto|tbu|phi)-[a-z]{2,6}$/i.test(userId);

            // Password validation:
            // at least 8 chars, one uppercase, one lowercase, one number, one special char
            const passwordValid =
                password.length >= 8 &&
                /[A-Z]/.test(password) &&
                /[a-z]/.test(password) &&
                /[0-9]/.test(password) &&
                /[^A-Za-z0-9]/.test(password);

            if (userIdValid && passwordValid) {
                sessionStorage.setItem('ntep_authorized', 'true');
                loginOverlay.style.display = 'none';
                mainContent.style.display = 'block';
                errorMsg.style.display = 'none';
            } else {
                errorMsg.style.display = 'block';
                errorMsg.textContent = "❌ Invalid credentials. Please try again.";
            }
        }

        window.onload = function() {
            if (sessionStorage.getItem('ntep_authorized') === 'true') {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
            }
        };
    </script>

    <script src="script.js"></script>
</body>
</html>

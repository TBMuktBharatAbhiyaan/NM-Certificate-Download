<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nikshay Mitra Certificate Download</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 20px;
      color: #222;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    h1 {
      margin-top: 0;
      color: #b71c1c;
      text-align: center;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 18px;
    }
    label {
      font-weight: 700;
      display: block;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }
    input.valid { border-color: #1b8f3a; }
    input.invalid { border-color: #d93025; }
    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
    }
    #downloadBtn {
      background: #b71c1c;
      color: #fff;
    }
    #downloadBtn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
    #previewBtn {
      background: #1a73e8;
      color: #fff;
    }
    #message {
      margin-top: 10px;
      font-weight: 700;
      min-height: 24px;
    }
    .error {
      color: red;
    }
    .success {
      color: #1b8f3a;
    }
    .preview-wrap {
      margin-top: 24px;
      text-align: center;
    }
    canvas {
      max-width: 100%;
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      display: none;
    }
    .note {
      font-size: 14px;
      color: #555;
      margin-top: 8px;
      line-height: 1.5;
    }
    .loading {
      display: none;
      margin-top: 10px;
      font-weight: 700;
      color: #444;
    }
    .loading.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Nikshay Mitra Certificate Download</h1>

    <div class="form-row">
      <div>
        <label for="nameInput">Name</label>
        <input id="nameInput" type="text" placeholder="Enter Name" maxlength="80" />
      </div>
      <div>
        <label for="idInput">Nikshay Mitra ID</label>
        <input id="idInput" type="text" placeholder="Enter NM ID" maxlength="12" />
      </div>
    </div>

    <div id="message"></div>

    <div class="buttons">
      <button id="previewBtn" type="button">Preview</button>
      <button id="downloadBtn" type="button" disabled>Download</button>
    </div>

    <div class="loading" id="loading">Generating certificate...</div>

    <div class="preview-wrap">
      <canvas id="certificateCanvas" width="1400" height="1000"></canvas>
      <div class="note">
        Upload your certificate template image as <b>certificate-template.jpg</b> in the same folder.
        The name and ID placement can be adjusted in <b>script.js</b>.
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>

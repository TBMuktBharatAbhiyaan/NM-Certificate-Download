<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikshay Mitra Certificate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #87ceeb 0%, #e0f6ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Login Page Styling */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #87ceeb 0%, #e0f6ff 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-container {
            text-align: center;
            position: relative;
            z-index: 10000;
        }

        .nikshay-logo {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ff8c00;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            letter-spacing: 1px;
        }

        .nikshay-logo span {
            color: #ff8c00;
        }

        .logo-icon {
            display: inline-block;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ff8c00, #ffa500);
            border-radius: 8px;
            margin-right: 10px;
            vertical-align: middle;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .continue-text {
            font-size: 20px;
            color: #333;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .login-box {
            background: white;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f8f8f8;
            color: #666;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1e90ff;
            background: white;
            box-shadow: 0 0 0 3px rgba(30, 144, 255, 0.1);
        }

        .form-group input::placeholder {
            color: #999;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1e90ff, #0066cc);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #0066cc, #004c99);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(30, 144, 255, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 15px;
            display: none;
            text-align: center;
            font-weight: 500;
        }

        /* Indian flag stripes */
        .flag-stripe {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 15px;
            z-index: 9998;
        }

        .stripe-orange {
            background: #ff9933;
            height: 5px;
        }

        .stripe-white {
            background: white;
            height: 5px;
        }

        .stripe-green {
            background: #138808;
            height: 5px;
        }

        /* Certificate Page */
        .container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #ff8c00;
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .input-group input.valid {
            border-color: green;
            background: #f0fff0;
        }

        .input-group input.invalid {
            border-color: red;
            background: #fff0f0;
        }

        #validationMessage {
            margin: 15px 0;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #previewBtn {
            background: #667eea;
            color: white;
        }

        #downloadBtn {
            background: #28a745;
            color: white;
        }

        #downloadBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .preview {
            border: 2px dashed #ddd;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
        }

        canvas {
            max-width: 100%;
            border: 1px solid #ccc;
        }

        #mainContent {
            background: linear-gradient(135deg, #87ceeb 0%, #e0f6ff 100%);
            min-height: 100vh;
            padding: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Login Section -->
    <div id="loginOverlay">
        <div class="login-container">
            <div class="nikshay-logo">
                <span style="color: #ff8c00;">Ni</span><span style="color: #ff8c00;">-kshay</span>
            </div>

            <div class="continue-text">Continue to Ni-kshay</div>

            <div class="login-box">
                <div class="form-group">
                    <label>User ID</label>
                    <input type="text" id="officialEmail" placeholder="Enter User ID">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="officialPassword" placeholder="Enter Password">
                </div>

                <button class="login-btn" onclick="checkAccess()">Login</button>

                <div class="error-message" id="loginError">❌ Access Denied</div>
            </div>
        </div>

        <!-- Indian Flag Stripes -->
        <div class="flag-stripe">
            <div class="stripe-orange"></div>
            <div class="stripe-white"></div>
            <div class="stripe-green"></div>
        </div>
    </div>

    <!-- Certificate Page -->
    <div id="mainContent">
        <div class="container">
            <h1>Nikshay Mitra Certificate</h1>

            <div class="input-group">
                <label for="nameInput">Full Name</label>
                <input type="text" id="nameInput" placeholder="Enter name" maxlength="50">
            </div>

            <div class="input-group">
                <label for="idInput">Nikshay Mitra ID</label>
                <input type="text" id="idInput" placeholder="Enter Valid & Active NM ID" maxlength="20">
            </div>

            <div id="validationMessage"></div>

            <div class="buttons">
                <button id="previewBtn">Preview</button>
                <button id="downloadBtn" disabled>Download PDF</button>
            </div>

            <div class="preview">
                <canvas id="certificateCanvas" width="800" height="500"></canvas>
                <div id="previewPlaceholder">
                    Enter name and NM ID to preview certificate
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        function checkAccess() {
            const userId = document.getElementById('officialEmail').value.trim().toLowerCase();
            const password = document.getElementById('officialPassword').value;
            const errorMsg = document.getElementById('loginError');
            const loginOverlay = document.getElementById('loginOverlay');
            const mainContent = document.getElementById('mainContent');

            // User ID must be 6-9 characters:
            // starts with dto-, sto-, tbu-, or phi-
            // followed by 2-6 letters (total 6-9 chars)
            const userIdValid = /^(dto|sto|tbu|phi)-[a-z]{2,6}$/i.test(userId);

            // Password validation:
            // at least 8 chars, one uppercase, one lowercase, one number, one special char
            const passwordValid =
                password.length >= 8 &&
                /[A-Z]/.test(password) &&
                /[a-z]/.test(password) &&
                /[0-9]/.test(password) &&
                /[^A-Za-z0-9]/.test(password);

            if (userIdValid && passwordValid) {
                sessionStorage.setItem('ntep_authorized', 'true');
                loginOverlay.style.display = 'none';
                mainContent.style.display = 'block';
                errorMsg.style.display = 'none';
            } else {
                errorMsg.style.display = 'block';
                errorMsg.textContent = "❌ Access Denied";
            }
        }

        window.onload = function() {
            if (sessionStorage.getItem('ntep_authorized') === 'true') {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
            }
        };
    </script>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikshay Mitra Certificate Download</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4b6cb7, #182848);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 800px;
            padding: 40px;
        }
        h1 {
            color: #b71c1c;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
            font-size: O.95rem;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }
        input:focus {
            border-color: #4b6cb7;
            box-shadow: 0 0 0 3px rgba(75,108,183,0.2);
        }
        input.valid {
            border-color: #28a745;
            background-color: rgba(40,167,69,0.05);
        }
        input.invalid {
            border-color: #dc3545;
            background-color: rgba(220,53,69,0.05);
        }
        #validationMessage {
            margin: 15px 0;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
            text-align: center;
        }
        #validationMessage.error {
            background: rgba(220,53,69,0.1);
            color: #dc3545;
            border: 1px solid rgba(220,53,69,0.2);
        }
        #validationMessage.success {
            background: rgba(40,167,69,0.1);
            color: #28a745;
            border: 1px solid rgba(40,167,69,0.2);
        }
        .button-group {
            display: flex;
            gap: 15px;
            margin: 25px 0;
        }
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        #previewBtn {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
        }
        #previewBtn:hover {
            background: linear-gradient(to right, #5568d3, #645392);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.3);
        }
        #downloadBtn {
            background: linear-gradient(to right, #28a745, #20c997);
            color: white;
        }
        #downloadBtn:hover:not(:disabled) {
            background: linear-gradient(to right, #218838, #1ba87e);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40,167,69,0.3);
        }
        #downloadBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .preview-section {
            border: 2px dashed #ddd;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-top: 30px;
            background: #f8f9fa;
        }
        #certificateCanvas {
            max-width: 100%;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: none;
            background: white;
            margin: 0 auto;
        }
        .hint {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
        .preview-title {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.2rem;
        }
        .preview-placeholder {
            padding: 30px;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Nikshay Mitra Certificate Generator</h1>
        
        <div class="input-group">
            <label for="nameInput">Full Name (as on certificate)</label>
            <input type="text" id="nameInput" placeholder="Enter participant's full name" maxlength="50">
            <div class="hint">Enter the exact name as it should appear on the certificate</div>
        </div>

        <div class="input-group">
            <label for="idInput">Nikshay Mitra ID</label>
            <input type="text" id="idInput" placeholder="Enter NM ID (e.g., M12345678901)" maxlength="12">
            <div class="hint">Format: Must be exactly 12 characters starting with 'M' followed by 11 digits</div>
        </div>

        <div id="validationMessage"></div>

        <div class="button-group">
            <button id="previewBtn">
                <span>👁️</span>
                Preview Certificate
            </button>
            <button id="downloadBtn" disabled>
                <span>⬇️</span>
                Download Certificate
            </button>
        </div>

        <div class="preview-section">
            <div class="preview-title">Certificate Preview</div>
            <canvas id="certificateCanvas" width="800" height="500"></canvas>
            <div class="preview-placeholder" id="previewPlaceholder">
                Enter valid details above and click "Preview Certificate" to see your certificate
            </div>
        </div>
    </div>

    <!-- jspdf library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- Main script -->
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikshay Mitra Certificate</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #4b6cb7;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #b71c1c;
            text-align: center;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        input.valid { border-color: green; background: #f0fff0; }
        input.invalid { border-color: red; background: #fff0f0; }
        #validationMessage {
            margin: 15px 0;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .buttons {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        #previewBtn { background: #667eea; color: white; }
        #downloadBtn { background: #28a745; color: white; }
        #downloadBtn:disabled { background: #ccc; cursor: not-allowed; }
        .preview {
            border: 2px dashed #ddd;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
        }
        canvas {
            max-width: 100%;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <!-- Login Section -->
    <div id="loginOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family: Arial;">
        <h2>Ni-kshay Login</h2>
        
        <div style="width: 300px;">
            <input type="text" id="officialEmail" placeholder="User ID" style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;">
            
            <input type="password" id="officialPassword" placeholder="Password" style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;">
            
            <button onclick="checkAccess()" style="width:100%; padding:10px; background:#b71c1c; color:white; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">Login</button>
        </div>
        
        <p id="loginError" style="color:red; display:none; margin-top:10px;">❌ Access Denied</p>
    </div>

    <div id="mainContent" style="display:none;">
        <div class="container">
            <h1>Nikshay Mitra Certificate</h1>
            
            <div class="input-group">
                <label for="nameInput">Full Name</label>
                <input type="text" id="nameInput" placeholder="Enter name" maxlength="50">
            </div>
            
            <div class="input-group">
                <label for="idInput">Nikshay Mitra ID</label>
                <input type="text" id="idInput" placeholder="Enter Valid & Active NM ID" maxlength="20">
            </div>
            
            <div id="validationMessage"></div>
            
            <div class="buttons">
                <button id="previewBtn">Preview</button>
                <button id="downloadBtn" disabled>Download PDF</button>
            </div>
            
            <div class="preview">
                <canvas id="certificateCanvas" width="800" height="500"></canvas>
                <div id="previewPlaceholder">
                    Enter name and NM ID to preview certificate
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- Login Functions -->
    <script>
        function checkAccess() {
            const userId = document.getElementById('officialEmail').value.trim().toLowerCase();
            const password = document.getElementById('officialPassword').value;
            const errorMsg = document.getElementById('loginError');
            const loginOverlay = document.getElementById('loginOverlay');
            const mainContent = document.getElementById('mainContent');

            // Check: User ID must contain dto-, sto-, tbu-, or phi- (case-insensitive)
            const userIdValid = userId.includes('dto-') || 
                               userId.includes('sto-') || 
                               userId.includes('tbu-') || 
                               userId.includes('phi-');
            
            // Password validation: at least 8 chars, alphanumeric, at least one uppercase, at least one special char
            const passwordValid = password.length >= 8 &&
                                /[A-Z]/.test(password) && // At least one uppercase
                                /[a-z]/.test(password) && // At least one lowercase
                                /[0-9]/.test(password) && // At least one number
                                /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password); // At least one special char

            if (userIdValid && passwordValid) {
                sessionStorage.setItem('ntep_authorized', 'true');
                loginOverlay.style.display = 'none';
                mainContent.style.display = 'block';
                errorMsg.style.display = 'none';
            } else {
                errorMsg.style.display = 'block';
                errorMsg.textContent = "❌ Access Denied";
            }
        }

        window.onload = function() {
            if (sessionStorage.getItem('ntep_authorized') === 'true') {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
            }
        };
    </script>
    
    <script src="script.js"></script>
</body>
</html>
